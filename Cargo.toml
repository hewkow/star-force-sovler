[package]
name = "star_force_sim"
version = "0.1.0"
edition = "2024"

[lib]
name = "star_force_sim"
crate-type = ["cdylib", "rlib"]

[dependencies]
num-format = "0.4.4"
rand = { version = "0.9.4", features = ["small_rng"] }
rayon = "1.12.0"
pyo3 = { version = "0.21.2", features = ["extension-module"] }